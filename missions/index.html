    <script type="module">
        import '@material/web/all.js';
        import { styles as typescaleStyles } from '@material/web/typography/md-typescale-styles.js';
        document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
    </script>

    <link rel="stylesheet" href="https://sflightx.com/resources/v4/dependency.css">

    <style>
        body {
            font-family: 'Outfit', 'DM Sans', sans-serif;
            overflow-x: hidden;
        }

        a {
            color: var(--md-sys-color-primary);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        sflightx-footer a,
        footer a,
        footer #legal-link a {
            color: var(--md-sys-color-primary);
            text-decoration: none;
        }

        #side-sheet {
            transform: none;
        }

        #navItems {
            padding: 1rem;
            overflow-y: auto;
            flex: 1;
        }

        #side-sheet md-list {
            background: transparent;
            --md-list-container-color: transparent;
            --md-list-item-label-text-color: #fff;
            --md-list-item-supporting-text-color: #9ca3af;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .header-page {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            pointer-events: none;
        }

        .header-page h1 {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        header .logo,
        header .header-actions {
            flex-shrink: 0;
        }

        header .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        main {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-top: 5.5rem;
        }

        .mission {
            width: min(820px, calc(100% - 2.5rem));
            margin: 0 auto;
            padding: 1.5rem 0 2.5rem;
        }

        #article-header,
        #grid {
            width: 100%;
        }

        #article {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            margin: 0 !important;
        }

        #article:empty::before {
            content: 'Loading mission…';
            display: block;
            color: var(--md-sys-color-on-surface-variant);
            padding: 1.25rem 0;
        }

        #article > .container,
        #article .container {
            width: 100% !important;
            max-width: 100% !important;
            margin: 0 !important;
            padding: 1.5rem 1.6rem !important;
            border-radius: 1.25rem !important;
            background: var(--md-sys-color-surface-container) !important;
            border: 1px solid var(--md-sys-color-outline-variant);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            box-sizing: border-box;
        }

        /* Two-column split (injected after article load) */
        .mission-split {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            width: 100%;
        }

        .mission-col {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            min-width: 0;
        }

        .mission-col--meta {
            gap: 0.65rem;
        }

        #article h3,
        #article h4,
        #article h5,
        #article h6 {
            margin: 0.85rem 0 0.35rem;
            letter-spacing: -0.02em;
            line-height: 1.25;
            color: var(--md-sys-color-on-surface);
        }

        #article > .container > h4:first-child,
        #article h4.md-typescale-headline-large:first-child,
        .mission-col--copy > h4:first-child {
            margin: 0 0 0.35rem;
            font-size: clamp(1.25rem, 2.6vw, 1.55rem) !important;
            font-weight: 700;
            line-height: 1.35;
        }

        #article h3.md-typescale-display-small,
        #article h3 {
            margin-top: 0.35rem;
            font-size: 1.05rem !important;
            font-weight: 750;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--md-sys-color-primary);
        }

        #article h6 {
            margin-top: 0;
            font-size: 0.9rem !important;
            font-weight: 500;
            color: var(--md-sys-color-on-surface-variant);
        }

        #article p {
            margin: 0;
            line-height: 1.7;
            color: var(--md-sys-color-on-surface-variant);
        }

        #article md-list {
            --md-list-container-color: transparent;
            --md-list-item-container-color: transparent;
            --md-list-item-label-text-color: var(--md-sys-color-on-surface);
            --md-list-item-supporting-text-color: var(--md-sys-color-on-surface-variant);
            --md-list-item-trailing-supporting-text-color: var(--md-sys-color-primary);
            width: 100%;
            margin: 0.15rem 0 0.75rem;
            padding: 0.25rem 0;
            border-radius: 1rem;
            background: color-mix(in srgb, var(--md-sys-color-surface) 55%, transparent);
            border: 1px solid var(--md-sys-color-outline-variant);
            overflow: hidden;
        }

        #article md-list-item {
            --md-list-item-one-line-container-height: 52px;
            --md-list-item-two-line-container-height: 64px;
            border-bottom: 1px solid color-mix(in srgb, var(--md-sys-color-outline-variant) 70%, transparent);
        }

        #article md-list-item:last-child {
            border-bottom: 0;
        }

        #article md-list-item [slot="headline"] {
            font-size: 0.86rem;
            font-weight: 650;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            line-height: 1.3;
        }

        #article md-list-item [slot="trailing-supporting-text"] {
            font-variant-numeric: tabular-nums;
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--md-sys-color-primary);
            white-space: nowrap;
        }

        #article img,
        #article video {
            max-width: 100%;
            height: auto;
            border-radius: 1rem;
            display: block;
        }

        #article iframe {
            width: 100% !important;
            max-width: 100%;
            aspect-ratio: 16 / 9;
            height: auto !important;
            border: 0;
            border-radius: 1rem;
            background: #000;
        }

        .twitter-tweet {
            margin: 0 auto !important;
        }

        .mission-empty {
            padding: 2rem 1.25rem;
            border-radius: 1.25rem;
            border: 1px dashed var(--md-sys-color-outline-variant);
            color: var(--md-sys-color-on-surface-variant);
            text-align: center;
            line-height: 1.6;
        }

        /* Laptop and up: half / half */
        @media (min-width: 1024px) {
            .mission {
                width: min(1180px, calc(100% - 3rem));
            }

            #article > .container,
            #article .container {
                padding: 1.6rem !important;
            }

            .mission-split {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 1.75rem 2rem;
                align-items: start;
            }

            .mission-col--meta {
                position: sticky;
                top: 6rem;
            }
        }

        @media (max-width: 968px) {
            main {
                padding-top: 5rem;
            }

            .header-page h1 {
                font-size: 0.92rem;
            }

            .mission {
                width: calc(100% - 2rem);
                padding: 1rem 0 2rem;
            }

            #article > .container,
            #article .container {
                padding: 1.15rem 1.1rem !important;
                border-radius: 1.05rem !important;
            }

            #article md-list-item [slot="headline"] {
                font-size: 0.78rem;
            }

            #article md-list-item [slot="trailing-supporting-text"] {
                font-size: 0.78rem;
            }
        }
    </style>
</head>

<body>
    <div id="side-sheet">
        <div id="side-sheet-header">
            <h3 class="md-typescale-headline-small" style="font-weight: 700; color: #fff;">SFlightX</h3>
            <span class="material-symbols-rounded" onclick="toggleSideSheet()">close</span>
        </div>
        <nav id="navItems"></nav>
    </div>

    <div id="locItems" hidden></div>
    <div id="backdrop" class="fixed inset-0 z-30 hidden" onclick="toggleSideSheet()"></div>

    <header>
        <div class="logo">
            <span class="material-symbols-rounded" onclick="toggleSideSheet()" id="menu">menu</span>
            <a href="https://sflightx.com">
                <img id="logo" src="https://sflightx.com/resources/v4/database/logo/logo.png" alt="sFlightX Logo">
            </a>
        </div>

        <div class="header-page">
            <h1 id="mission-title">Mission</h1>
        </div>

        <div class="header-actions">
            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                <span class="material-symbols-rounded">dark_mode</span>
                <md-switch id="themeToggle"></md-switch>
            </label>
        </div>
    </header>

    <main>
        <div class="mission">
            <div id="article-header">
                <div id="grid"></div>
            </div>
            <div id="article"></div>
        </div>

        <div desktop-gap>
            <sflightx-footer></sflightx-footer>
        </div>
    </main>

    <script src="https://sflightx.com/resources/v4/dependency.js"></script>
    <script type="module">
        import { renderNavigation } from 'https://sflightx.com/resources/v4/data/drawer/nav-loader.js';
        import { navData } from 'https://sflightx.com/resources/v4/data/drawer/sflightx_com/index.js';

        try {
            renderNavigation(navData);
        } catch (e) {
            console.error('Navigation drawer failed to load', e);
        }

        document.querySelectorAll('#navItems md-list-item').forEach((item) => {
            item.addEventListener('click', () => {
                const sheet = document.getElementById('side-sheet');
                if (sheet && sheet.classList.contains('open') && typeof toggleSideSheet === 'function') {
                    toggleSideSheet();
                }
            });
        });
    </script>
    <script src="https://sflightx.com/resources/v4/function/missions/article.js"></script>
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const titleEl = document.getElementById('mission-title');
            const article = document.getElementById('article');

            if (id && titleEl) {
                const pretty = id
                    .replace(/[-_]+/g, ' ')
                    .replace(/\b\w/g, (c) => c.toUpperCase());
                titleEl.textContent = pretty;
                document.title = pretty + ' | SFlightX';
            } else if (article) {
                article.innerHTML = '<div class="mission-empty">No mission selected.<br>Open a mission from <a href="https://sflightx.com/launches">Launches</a>.</div>';
            }

            function isMetaStart(node) {
                if (!node || node.nodeType !== 1) return false;
                const tag = node.tagName.toLowerCase();
                if (tag === 'h3' || tag === 'md-list') return true;
                if (tag === 'h6') return true;
                return false;
            }

            function splitMissionLayout() {
                if (!article || article.dataset.split === '1') return;

                const host = article.querySelector(':scope > .container') || article;
                const nodes = Array.from(host.children);
                if (nodes.length < 3) return;

                // Only split if we actually have list/timeline content
                const hasMeta = nodes.some((n) => {
                    const t = n.tagName.toLowerCase();
                    return t === 'md-list' || t === 'h3';
                });
                if (!hasMeta) return;

                const left = document.createElement('div');
                left.className = 'mission-col mission-col--copy';
                const right = document.createElement('div');
                right.className = 'mission-col mission-col--meta';

                let target = left;
                nodes.forEach((node) => {
                    if (target === left && isMetaStart(node)) {
                        target = right;
                    }
                    target.appendChild(node);
                });

                if (!right.children.length || !left.children.length) {
                    // rollback
                    [...left.children, ...right.children].forEach((n) => host.appendChild(n));
                    return;
                }

                const wrap = document.createElement('div');
                wrap.className = 'mission-split';
                wrap.append(left, right);
                host.appendChild(wrap);
                article.dataset.split = '1';
            }

            const observer = new MutationObserver(() => {
                if (article.children.length) {
                    splitMissionLayout();
                }
            });
            observer.observe(article, { childList: true, subtree: true });

            // Fallback in case content was already painted
            window.setTimeout(splitMissionLayout, 400);
            window.setTimeout(splitMissionLayout, 1200);
        })();
    </script>
</body>
