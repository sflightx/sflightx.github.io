<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="version" content="0.2">
    <meta name="author" content="SFlightX">
    <meta name="version_date" content="5-18-2024">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SFlightX vehicle fleet — operational rockets for Juno: New Origins.">
    <meta property="og:image" content="https://sflightx.com/resources/v4/database/logo/logo.png">
    <meta property="og:url" content="https://sflightx.com/vehicle/">
    <meta property="og:title" content="Vehicles | SFlightX">
    <meta property="og:description" content="See the fleet of SFlightX rockets in operation.">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:site" content="@SFlightXJNO">
    <meta name="twitter:title" content="Vehicles | SFlightX">
    <meta name="twitter:description" content="See the fleet of SFlightX rockets in operation.">
    <meta name="twitter:image" content="https://sflightx.com/resources/v4/database/logo/logo.png">

    <title>Vehicles | SFlightX</title>
    <link rel="icon" type="image/png" href="https://sflightx.com/resources/v4/database/logo/logo.png">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script type="importmap">
    {
      "imports": {
        "@material/web/": "https://esm.run/@material/web/"
      }
    }
    </script>
    <script type="module">
        import '@material/web/all.js';
        import { styles as typescaleStyles } from '@material/web/typography/md-typescale-styles.js';
        document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
    </script>

    <link rel="stylesheet" href="https://sflightx.com/resources/v4/dependency.css">

    <style>
        body {
            font-family: 'Outfit', 'DM Sans', sans-serif;
            overflow-x: hidden;
        }

        a {
            color: var(--md-sys-color-primary);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        sflightx-footer a,
        footer a,
        footer #legal-link a {
            color: var(--md-sys-color-primary);
            text-decoration: none;
        }

        #side-sheet {
            transform: none;
        }

        #navItems {
            padding: 1rem;
            overflow-y: auto;
            flex: 1;
        }

        #side-sheet md-list {
            background: transparent;
            --md-list-container-color: transparent;
            --md-list-item-label-text-color: #fff;
            --md-list-item-supporting-text-color: #9ca3af;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .header-page {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            pointer-events: none;
        }

        .header-page h1 {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        header .logo,
        header .header-actions {
            flex-shrink: 0;
        }

        header .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        main {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-top: 5.5rem;
        }

        .fleet {
            width: min(1100px, calc(100% - 2.5rem));
            margin: 0 auto;
            padding: 1.5rem 0 3rem;
        }

        #data:empty::before {
            content: 'Loading vehicles…';
            display: block;
            color: var(--md-sys-color-on-surface-variant);
            padding: 1rem 0;
        }

        .vehicle-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.25rem;
            width: 100%;
        }

        .vehicle-card {
            width: 100%;
            border-radius: 1.25rem;
            overflow: hidden;
            background: var(--md-sys-color-surface-container);
            border: 1px solid var(--md-sys-color-outline-variant);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.16);
            cursor: pointer;
            transform: translateY(0);
            transition:
                transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1),
                box-shadow 0.28s ease,
                border-color 0.28s ease;
        }

        .vehicle-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
            border-color: color-mix(in srgb, var(--md-sys-color-primary) 35%, var(--md-sys-color-outline-variant));
        }

        .vehicle-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .vehicle-card:hover img {
            transform: scale(1.04);
        }

        .vehicle-card .body {
            padding: 1rem 1.1rem 1.15rem;
        }

        .vehicle-card .name {
            margin: 0 0 0.25rem;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .vehicle-card .company {
            margin: 0;
            font-size: 0.88rem;
            color: var(--md-sys-color-on-surface-variant);
        }

        .fleet-empty {
            padding: 2rem 1.25rem;
            border-radius: 1.25rem;
            border: 1px dashed var(--md-sys-color-outline-variant);
            color: var(--md-sys-color-on-surface-variant);
            text-align: center;
        }

        @media (max-width: 968px) {
            main {
                padding-top: 5rem;
            }

            .header-page h1 {
                font-size: 0.95rem;
            }

            .fleet {
                width: calc(100% - 2.2rem);
                padding: 1rem 0 2.5rem;
            }

            .vehicle-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .vehicle-card,
            .vehicle-card img {
                transition: none;
            }

            .vehicle-card:hover {
                transform: none;
            }
        }
    </style>
</head>

<body>
    <div id="side-sheet">
        <div id="side-sheet-header">
            <h3 class="md-typescale-headline-small" style="font-weight: 700; color: #fff;">SFlightX</h3>
            <span class="material-symbols-rounded" onclick="toggleSideSheet()">close</span>
        </div>
        <nav id="navItems"></nav>
    </div>

    <div id="locItems" hidden></div>
    <div id="backdrop" class="fixed inset-0 z-30 hidden" onclick="toggleSideSheet()"></div>

    <header>
        <div class="logo">
            <span class="material-symbols-rounded" onclick="toggleSideSheet()" id="menu">menu</span>
            <a href="https://sflightx.com">
                <img src="https://sflightx.com/resources/v4/database/logo/logo.png" alt="sFlightX Logo">
            </a>
        </div>

        <div class="header-page">
            <h1>JNO Vehicles</h1>
        </div>

        <div class="header-actions">
            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                <span class="material-symbols-rounded">dark_mode</span>
                <md-switch id="themeToggle"></md-switch>
            </label>
        </div>
    </header>

    <main>
        <div class="fleet">
            <div id="data"></div>
        </div>

        <div desktop-gap>
            <sflightx-footer></sflightx-footer>
        </div>
    </main>

    <script type="module" src="https://sflightx.com/resources/v4/function/serviceAuth/initializeFirebase.js"></script>
    <script src="https://sflightx.com/resources/v4/dependency.js"></script>
    <script type="module">
        import { renderNavigation } from 'https://sflightx.com/resources/v4/data/drawer/nav-loader.js';
        import { navData } from 'https://sflightx.com/resources/v4/data/drawer/sflightx_com/index.js';

        try {
            renderNavigation(navData);
        } catch (e) {
            console.error('Navigation drawer failed to load', e);
        }

        document.querySelectorAll('#navItems md-list-item').forEach((item) => {
            item.addEventListener('click', () => {
                const sheet = document.getElementById('side-sheet');
                if (sheet && sheet.classList.contains('open') && typeof toggleSideSheet === 'function') {
                    toggleSideSheet();
                }
            });
        });
    </script>
    <script type="module">
        import { db } from 'https://sflightx.com/resources/v4/function/serviceAuth/initializeFirebase.js';
        import { ref, get } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';

        const firebasePath = 'static/vehicle';

        async function fetchVehicles() {
            try {
                const snapshot = await get(ref(db, firebasePath));
                const data = snapshot.val();
                return Object.entries(data || {}).map(([id, value]) => ({
                    id,
                    name: value.name,
                    key: value.key,
                    thumbnail: value.thumbnail,
                    companyId: value.companyId,
                    intent: value.intent
                }));
            } catch (error) {
                console.error('Error fetching vehicles:', error);
                return [];
            }
        }

        async function getCompanyName(companyId) {
            try {
                const companySnapshot = await get(ref(db, `static/company/${companyId}/name`));
                return companySnapshot.exists() ? companySnapshot.val() : companyId;
            } catch (e) {
                console.error('Error fetching company name:', e);
                return companyId;
            }
        }

        async function renderVehicles() {
            const vehicles = await fetchVehicles();
            const dataDiv = document.getElementById('data');
            if (!dataDiv) return;

            dataDiv.innerHTML = '';

            if (!vehicles.length) {
                dataDiv.innerHTML = '<div class="fleet-empty">No vehicles found.</div>';
                return;
            }

            const container = document.createElement('div');
            container.className = 'vehicle-grid';

            await Promise.all(
                vehicles.map(async (vehicle) => {
                    const card = document.createElement('article');
                    card.className = 'vehicle-card';
                    card.setAttribute('role', 'link');
                    card.tabIndex = 0;

                    const companyName = await getCompanyName(vehicle.companyId);
                    const thumb = vehicle.thumbnail || 'https://sflightx.com/resources/v4/database/logo/logo.png';

                    card.innerHTML = `
                        <img src="${thumb}" alt="" loading="lazy">
                        <div class="body">
                            <p class="name">${vehicle.name || 'Untitled vehicle'}</p>
                            <p class="company">${companyName || ''}</p>
                        </div>
                    `;

                    const go = () => {
                        if (!vehicle.intent) return;
                        if (vehicle.intent.startsWith('http://') || vehicle.intent.startsWith('https://')) {
                            window.location.href = vehicle.intent;
                        } else {
                            window.location.href = `https://sflightx.com/vehicle/${vehicle.intent}.html`;
                        }
                    };

                    card.addEventListener('click', go);
                    card.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            go();
                        }
                    });

                    container.appendChild(card);
                })
            );

            dataDiv.appendChild(container);
        }

        window.addEventListener('DOMContentLoaded', renderVehicles);
    </script>
</body>

</html>
