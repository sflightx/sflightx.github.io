<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="version" content="0.2">
    <meta name="author" content="SFlightX">
    <meta name="version_date" content="5-18-2024">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Add the JNO Spaceflight Discord bot to your server — announcements and launch updates from SFlightX.">
    <meta property="og:image" content="https://sflightx.com/resources/v4/database/logo/logo.png">
    <meta property="og:url" content="https://sflightx.com/invite/">
    <meta property="og:title" content="JNO Spaceflight Discord Bot">
    <meta property="og:description" content="Add the SFlightX Discord bot to your server. Sometimes dead — just awaiting signal acquisition from Mars.">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:site" content="@SFlightXJNO">
    <meta name="twitter:title" content="JNO Spaceflight Discord Bot">
    <meta name="twitter:description" content="Add the SFlightX Discord bot to your server. Sometimes dead — just awaiting signal acquisition from Mars.">
    <meta name="twitter:image" content="https://sflightx.com/resources/v4/database/logo/logo.png">

    <title>JNO Spaceflight Bot | SFlightX</title>
    <link rel="icon" type="image/png" href="https://sflightx.com/resources/v4/database/logo/logo.png">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script type="importmap">
    {
      "imports": {
        "@material/web/": "https://esm.run/@material/web/"
      }
    }
    </script>
    <script type="module">
        import '@material/web/all.js';
        import { styles as typescaleStyles } from '@material/web/typography/md-typescale-styles.js';
        document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
    </script>

    <link rel="stylesheet" href="https://sflightx.com/resources/v4/dependency.css">

    <style>
        body {
            font-family: 'Outfit', 'DM Sans', sans-serif;
            overflow-x: hidden;
        }

        a {
            color: var(--md-sys-color-primary);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        sflightx-footer a,
        footer a,
        footer #legal-link a {
            color: var(--md-sys-color-primary);
            text-decoration: none;
        }

        #side-sheet {
            transform: none;
        }

        #navItems {
            padding: 1rem;
            overflow-y: auto;
            flex: 1;
        }

        #side-sheet md-list {
            background: transparent;
            --md-list-container-color: transparent;
            --md-list-item-label-text-color: #fff;
            --md-list-item-supporting-text-color: #9ca3af;
        }

        main {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .invite {
            width: min(720px, calc(100% - 2.5rem));
            margin: 0 auto;
            padding: 7.5rem 0 3.5rem;
        }

        .kicker {
            display: inline-flex;
            padding: 0.4rem 0.9rem;
            border-radius: 999px;
            border: 1px solid color-mix(in srgb, var(--md-sys-color-primary) 40%, transparent);
            background: color-mix(in srgb, var(--md-sys-color-primary) 12%, transparent);
            color: var(--md-sys-color-primary);
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .invite h1 {
            margin: 0.85rem 0 0.75rem;
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        .invite p {
            margin: 0 0 1.75rem;
            max-width: 36rem;
            font-size: 1.08rem;
            line-height: 1.65;
            color: var(--md-sys-color-on-surface-variant);
        }

        @media (max-width: 968px) {
            .invite {
                width: calc(100% - 2.3rem);
                padding: 6.5rem 0 2.5rem;
            }
        }
    </style>
</head>

<body>
    <div id="side-sheet">
        <div id="side-sheet-header">
            <h3 class="md-typescale-headline-small" style="font-weight: 700; color: #fff;">SFlightX</h3>
            <span class="material-symbols-rounded" onclick="toggleSideSheet()">close</span>
        </div>
        <nav id="navItems"></nav>
    </div>

    <div id="locItems" hidden></div>
    <div id="backdrop" class="fixed inset-0 z-30 hidden" onclick="toggleSideSheet()"></div>

    <header>
        <div class="logo">
            <span class="material-symbols-rounded" onclick="toggleSideSheet()" id="menu">menu</span>
            <a href="https://sflightx.com">
                <img src="https://sflightx.com/resources/v4/database/logo/logo.png" alt="sFlightX Logo">
            </a>
        </div>
        <div style="display: flex; gap: 1rem; align-items: center;">
            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                <span class="material-symbols-rounded">dark_mode</span>
                <md-switch id="themeToggle"></md-switch>
            </label>
        </div>
    </header>

    <main>
        <section class="invite">
            <span class="kicker">Discord</span>
            <h1>JNO Spaceflight Bot</h1>
            <p>
                Add the bot to your server. Sometimes dead — just awaiting signal acquisition from <strong>Mars</strong>.
            </p>
            <md-filled-tonal-button
                href="https://discord.com/oauth2/authorize?client_id=955364482719285259&scope=bot&permissions=274878097472">
                Add bot to server
            </md-filled-tonal-button>
        </section>

        <div desktop-gap>
            <sflightx-footer></sflightx-footer>
        </div>
    </main>

    <script src="https://sflightx.com/resources/v4/dependency.js"></script>
    <script type="module">
        import { renderNavigation } from 'https://sflightx.com/resources/v4/data/drawer/nav-loader.js';
        import { navData } from 'https://sflightx.com/resources/v4/data/drawer/sflightx_com/index.js';

        try {
            renderNavigation(navData);
        } catch (e) {
            console.error('Navigation drawer failed to load', e);
        }

        document.querySelectorAll('#navItems md-list-item').forEach((item) => {
            item.addEventListener('click', () => {
                const sheet = document.getElementById('side-sheet');
                if (sheet && sheet.classList.contains('open') && typeof toggleSideSheet === 'function') {
                    toggleSideSheet();
                }
            });
        });
    </script>
</body>

</html>
