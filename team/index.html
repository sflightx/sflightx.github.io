<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="version" content="1.5">
    <meta name="author" content="SFlightX">
    <meta name="version_date" content="04-23-2025">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1">
    <meta name="description"
        content="We provide high quality services for your JNO Payloads to Droo, or Earth and beyond!">
    <meta name="keywords" content="SFlightX, App, Tutorial, Help, Spaceflight Simulator, Juno: New Origins">
    <meta property="og:image" content="https://sflightx.com/resources/static/logo.png">
    <meta property="og:url" content="sflightx.com">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:site" content="@SFlightXJNO">
    <meta name="twitter:title" content="sFlightX">
    <meta name="twitter:description"
        content="We provide high quality services for your JNO Payloads to Droo, or Earth and beyond!">
    <meta name="twitter:image" content="https://sflightx.com/resources/static/logo.png">

    <title>SFlightX - Organizational Chart</title>
    <link rel="icon" type="image/png" href="https://sflightx.com/resources/v4/database/logo/logo.png">

    <!-- Google Fonts & Material Symbols -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3847112193670696"
        crossorigin="anonymous"></script>

    <script type="importmap">
    {
      "imports": {
        "@material/web/": "https://esm.run/@material/web/"
      }
    }
    </script>
    <script type="module">
        import '@material/web/all.js';
        import { styles as typescaleStyles } from '@material/web/typography/md-typescale-styles.js';
        document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
    </script>

    <!-- Global & Page-Specific Stylesheets -->
    <link rel="stylesheet" href="https://sflightx.com/resources/v4/dependency.css">

    <style>
        main {
            padding: 2rem 1rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .content-wrapper {
            padding: 0 1rem;
        }

        /* Hero container for CEO (full width center) */
        .ceo-section {
            display: flex;
            justify-content: center;
            margin-bottom: 3rem;
        }

        .ceo-container {
            width: 100%;
            max-width: 600px;
        }

        /* Responsive Grid for Moderators and Teams */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        @media (min-width: 768px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1024px) {
            .grid-container {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* Card Component Styling */
        .container {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            padding: 1.25rem;
            background-color: var(--md-sys-color-surface-container-low, rgba(255, 255, 255, 0.03));
            border: 1px solid var(--md-sys-color-outline-variant, rgba(255, 255, 255, 0.08));
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            height: 100%;
            box-sizing: border-box;
        }

        .container:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
        }

        [shape="rounded"] {
            border-radius: 16px;
        }

        .profile {
            width: 72px;
            height: 72px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid var(--md-sys-color-primary, #6750A4);
            flex-shrink: 0;
            background-color: #333;
        }

        .profile-info {
            overflow: hidden;
        }

        .profile-info h2 {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin: 0 0 0.2rem 0;
        }

        .profile-info p {
            margin: 0;
        }

        h1.page-title {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .section-header {
            margin-top: 2.5rem;
            margin-bottom: 1rem;
        }

        sflightx-footer {
            display: block;
            margin-top: 4rem;
        }
    </style>
</head>

<body>
    <div id="side-sheet">
        <div id="side-sheet-header">
            <h3 class="md-typescale-headline-small">SFlightX</h3>
            <span class="material-symbols-rounded" onclick="toggleSideSheet()">close</span>
        </div>
        <nav id="navItems"></nav>
    </div>
    
    <div id="backdrop" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden" onclick="toggleSideSheet()"></div>
    
    <header>
        <div class="logo">
            <span class="material-symbols-rounded" onclick="toggleSideSheet()" id="menu">menu</span>
            <a href="https://sflightx.com">
                <img id="logo" src="https://sflightx.com/resources/static/logo.png" alt="sFlightX Logo">
            </a>
        </div>
        <label>
            <span class="material-symbols-rounded">dark_mode</span>
            <md-switch id="themeToggle"></md-switch>
        </label>
    </header>

    <main>
        <div class="content-wrapper">
            <h1 class="md-typescale-display-large page-title">SFlightX Organizational Chart</h1>

            <!-- CEO Section -->
            <div class="ceo-section">
                <div class="container ceo-container" shape="rounded">
                    <img src="https://sflightx.com/resources/v4/database/image/sflightx_com/teams/starglenn.jpg"
                        alt="Edrick's Profile" class="profile"
                        onerror="this.src='https://placehold.co/72x72/222/fff?text=CEO'">
                    <div class="profile-info">
                        <h2 class="md-typescale-headline-medium">Edrick</h2>
                        <p class="md-typescale-title-small">@starglenn_</p>
                        <p class="md-typescale-body-medium" style="opacity: 0.8;">CEO, SFlightX</p>
                    </div>
                </div>
            </div>

            <!-- Moderators Section Header -->
            <h4 class="md-typescale-display-small section-header">Moderators</h4>
            <h6 class="md-typescale-headline-medium section-header" style="margin-top: 1.5rem;">Discord</h6>

            <!-- Responsive Grid for Moderators -->
            <div class="grid-container">
                <div class="container" shape="rounded">
                    <img src="https://sflightx.com/resources/static/logo.png" alt="Mafia's Profile" class="profile"
                        onerror="this.src='https://placehold.co/72x72/222/fff?text=M'">
                    <div class="profile-info">
                        <h2 class="md-typescale-headline-small">Mafia</h2>
                        <p class="md-typescale-title-small">@spacemafia24</p>
                        <p class="md-typescale-body-small" style="opacity: 0.8;">Discord Moderator</p>
                    </div>
                </div>

                <div class="container" shape="rounded">
                    <img src="https://i.imgur.com/dDvxUJX.jpeg" alt="LeComrad1917's Profile" class="profile"
                        onerror="this.src='https://placehold.co/72x72/222/fff?text=LC'">
                    <div class="profile-info">
                        <h2 class="md-typescale-headline-small">LeComrad1917</h2>
                        <p class="md-typescale-title-small">@lecomrad1917</p>
                        <p class="md-typescale-body-small" style="opacity: 0.8;">Discord Server</p>
                    </div>
                </div>

                <div class="container" shape="rounded">
                    <img src="https://sflightx.com/resources/static/logo.png" alt="Stone's Profile" class="profile"
                        onerror="this.src='https://placehold.co/72x72/222/fff?text=S'">
                    <div class="profile-info">
                        <h2 class="md-typescale-headline-small">Stone</h2>
                        <p class="md-typescale-title-small">stone8502</p>
                        <p class="md-typescale-body-small" style="opacity: 0.8;">Discord Server</p>
                    </div>
                </div>

                <div class="container" shape="rounded">
                    <img src="https://sflightx.com/resources/static/logo.png" alt="StarJNO's Profile" class="profile"
                        onerror="this.src='https://placehold.co/72x72/222/fff?text=D'">
                    <div class="profile-info">
                        <h2 class="md-typescale-headline-small" style="font-size: 1.1rem;">デストロイヤー 元SFSプレイヤー</h2>
                        <p class="md-typescale-title-small">starjnomro7288</p>
                        <p class="md-typescale-body-small" style="opacity: 0.8;">Discord Server</p>
                    </div>
                </div>
            </div>
        </div>

        <sflightx-footer></sflightx-footer>
    </main>
    <!-- Dependencies & Scripts -->
    <script src="https://sflightx.com/resources/v4/dependency.js"></script>
    <script type="module">
        import { renderNavigation } from 'https://sflightx.com/resources/v4/data/drawer/nav-loader.js';
        import { navData } from 'https://sflightx.com/resources/v4/data/drawer/sflightx_com/index.js';
        renderNavigation(navData);
    </script>
</body>

</html>
